[project]
name = "video-safety"
version = "0.1.0"
description = "Video Brand Safety & Compliance Analyzer using LangChain and Google Gemini"
readme = "README.md"
authors = [
    { name = "ZaidAR49", email = "148114243+ZaidAR49@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[project.scripts]
video-safety = "video_safety.main:main"

[tool.uv]
link-mode = "copy"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
